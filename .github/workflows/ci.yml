name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests Glue/jobs
      - name: Test
        run: pytest -q
      - name: Compile
        run: python -m compileall -q src tests Glue/jobs
      - name: Audit Python dependencies
        run: pip-audit . --progress-spinner off
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Initialise Terraform
        run: terraform -chdir=infrastructure/terraform init -backend=false
      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform validate
