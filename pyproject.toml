[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nz-migration-data-pipeline"
version = "0.2.0"
description = "Revision-aware local and AWS pipeline for Stats NZ migration releases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "polars>=1.20,<2",
  "pyarrow>=23.0.1,<24",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.8,<3",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
nz-migration-pipeline = "nz_migration_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

